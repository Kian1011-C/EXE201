    }
  </style>

<body>
  <div id="root"></div>

  <!-- Load Design Canvas Component -->
  <script type="text/babel" src="design-canvas.jsx"></script>

  <!-- Load Artboards -->
  <script type="text/babel" src="checkout-artboards.jsx"></script>

  <!-- Main App Mount -->
  <script type="text/babel">
    const { useState } = React;

    function App() {
      return (
        <div className="w-screen h-screen">
          <DesignCanvas>
            <DCSection
              id="checkout-variations"
              title="InsurMatch CRM — 3 Checkout Page Design Explorations"
              subtitle="So sánh 3 phong cách trải nghiệm thanh toán B2B SaaS: Swiss Clean, Modern Dark Mode, và 3-Step Wizard"
            >
              {/* Artboard A */}
              <DCArtboard
                id="artboard-swiss-clean"
                label="A · Swiss B2B SaaS Clean (2-Column Enterprise)"
                width={1020}
              >
                <SwissCleanCheckout />
              </DCArtboard>

              {/* Artboard B */}
              <DCArtboard
                id="artboard-dark-fintech"
                label="B · Modern Fintech Dark Mode (High-Velocity PayOS)"
                width={1020}
              >
                <DarkFintechCheckout />
              </DCArtboard>

              {/* Artboard C */}
              <DCArtboard
                id="artboard-wizard"
                label="C · Conversion-Optimized 3-Step Wizard"
                width={1020}
              >
                <WizardCheckout />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
