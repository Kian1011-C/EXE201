<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>InsurMatch Checkout — Mobile & Desktop Design Preview</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Pinned React 18, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Load Artboards Definition -->
  <script type="text/babel" src="/designs/checkout-page/checkout-artboards.jsx"></script>

  <!-- Mobile-Optimized Viewer Switcher -->
  <script type="text/babel">
    const { useState } = React;

    function MobileViewer() {
      const [currentView, setCurrentView] = useState('swiss'); // 'swiss' | 'dark' | 'wizard'

      return (
        <div className="min-h-screen flex flex-col bg-slate-950">
          {/* Top Sticky Bar for Phone Viewers */}
          <header className="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 p-3 sm:p-4">
            <div className="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="w-7 h-7 rounded-lg bg-blue-600 text-white font-black text-xs flex items-center justify-center">
                  IM
                </span>
                <span className="text-xs sm:text-sm font-black text-white tracking-tight">
                  InsurMatch Checkout UI (Mobile Review)
                </span>
              </div>

              {/* 3-Style Tab Switcher */}
              <div className="flex items-center gap-1 p-1 bg-slate-800/80 rounded-xl text-xs font-bold border border-slate-700/80 w-full sm:w-auto overflow-x-auto justify-center">
                <button
                  type="button"
                  onClick={() => setCurrentView('swiss')}
                  className={`px-3 py-1.5 rounded-lg transition whitespace-nowrap ${
                    currentView === 'swiss'
                      ? 'bg-blue-600 text-white shadow'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  1. Swiss Clean
                </button>
                <button
                  type="button"
                  onClick={() => setCurrentView('dark')}
                  className={`px-3 py-1.5 rounded-lg transition whitespace-nowrap ${
                    currentView === 'dark'
                      ? 'bg-emerald-600 text-white shadow'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  2. Dark Fintech
                </button>
                <button
                  type="button"
                  onClick={() => setCurrentView('wizard')}
                  className={`px-3 py-1.5 rounded-lg transition whitespace-nowrap ${
                    currentView === 'wizard'
                      ? 'bg-indigo-600 text-white shadow'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  3. 3-Step Wizard
                </button>
              </div>
            </div>
          </header>

          {/* Active Screen Container */}
          <main className="flex-1 p-2 sm:p-6 flex items-start justify-center">
            <div className="w-full max-w-5xl">
              {currentView === 'swiss' && <SwissCleanCheckout />}
              {currentView === 'dark' && <DarkFintechCheckout />}
              {currentView === 'wizard' && <WizardCheckout />}
            </div>
          </main>

          {/* Bottom Fast Link to Real React App Checkout */}
          <footer className="p-4 bg-slate-900 border-t border-slate-800 text-center">
            <a
              href="/checkout-preview"
              className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-lg transition"
            >
              <span>🚀 Mở Trang Thanh Toán React App Thực Tế</span>
              <span>›</span>
            </a>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MobileViewer />);
  </script>
</body>
</html>
